spring:
  application:
    name: core
  jackson:
    serialization:
      write-date-keys-as-timestamps: false
    date-time-format: ${JACKSON_SERIALIZATION_DATE_TIME_FORMAT}
  main:
    allow-circular-references: true
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  jpa:
    show-sql: true
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        format_sql: true
  flyway:
    baseline-on-migrate: true
  mail:
    host: ${MAIL_HOST}
    port: ${MAIL_PORT}
    password: ${MAIL_PASSWORD}
    username: ${MAIL_USERNAME}
    properties:
      mail:
        smtp:
          auth: ${MAIL_PROPERTIES_SMTP_AUTH}
          starttls:
            enable: ${MAIL_PROPERTIES_SMTP_STARTTLS_ENABLE}

environment:
  dateTime:
    distance: ${DATETIME_DISTANCE}
    unit: ${DATETIME_UNIT}
  accessToken:
    secretKey: ${ACCESS_TOKEN_SECRET_KEY}
    expired: ${ACCESS_TOKEN_EXPIRED}
  refreshToken:
    expired: ${REFRESH_TOKEN_EXPIRED}